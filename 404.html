<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/favicons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/favicons/logo-icon.png" />
    <title>Page Not Found | Deka Works Studio</title>
    <meta
      name="description"
      content="The page you are looking for cannot be found. Return to Deka Works Studio homepage or contact our team."

    <link rel="canonical" href="https://dekaworks.com/404.html" />

  </head>
  <body>
    <header class="site-header" id="top">
      <div class="container nav-wrap">
        <a class="brand" href="index.html" aria-label="Deka Works Studio home">

    <main class="not-found">

        <h1 id="not-found-title">Page not found</h1>

          <a class="btn" href="index.html">Back to Homepage</a>
          <a class="btn btn-ghost" href="mailto:info@dekaworks.com">Contact Us</a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <p>© <span id="year"></span> Deka Works Studio. Independent app studio.</p>
      </div>
    </footer>

    <script defer src="script.js"></script>
